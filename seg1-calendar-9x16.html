<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeHisabi Promo - Scene 1 (0s - 5.48s)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>:root {
            --bg-deep: #060b16;
            --bg-surface: #0d1629;
            --card-bg: rgba(17, 27, 48, 0.78);
            --card-border: rgba(255, 255, 255, 0.09);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-emerald: #10b981;
            --accent-emerald-glow: rgba(16, 185, 129, 0.22);
            --accent-coral: #f43f5e;
            --accent-coral-glow: rgba(244, 63, 94, 0.22);
            --accent-amber: #f59e0b;
            --accent-amber-glow: rgba(245, 158, 11, 0.22);
            --current-accent: var(--accent-emerald);
            --current-glow: var(--accent-emerald-glow);
        }

* {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-deep);
            font-family: 'Hind Siliguri', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

/* Ambient Background Mesh & Grid */
        .ambient-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 25%, var(--current-glow), transparent 45%),
                radial-gradient(circle at 80% 75%, rgba(56, 189, 248, 0.10), transparent 50%),
                linear-gradient(160deg, #050912 0%, #0b1324 55%, #070d19 100%);
            transition: background 0.6s ease;
            z-index: 0;
        }

.grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(circle at center, black 45%, transparent 90%);
            z-index: 1;
        }

.glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 26px;
            padding: 28px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                        border-color 0.45s ease,
                        box-shadow 0.45s ease;
        }

/* Left Card: Calendar Display */
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

.card-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

.icon-box {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--current-accent);
            transition: all 0.4s ease;
        }
        /* ===== Perfect 9:16 stage, content pinned top-center ===== */
        body {
            height: 100dvh;
        }
        .stage {
            aspect-ratio: 9 / 16;
            height: min(100dvh, 177.78vw);
            container-type: size;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 10cqw;
            overflow: hidden;
        }
        .main-grid {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
        }

        /* ===== Month calendar card ===== */
        #calendarCard {
            width: 82%;
            padding: 6cqw;
            border-radius: 6cqw;
            opacity: 0;
            border-color: rgba(16, 185, 129, 0.30);
            /* soft green halo behind the card */
            box-shadow: 0 0 90px rgba(16, 185, 129, 0.16),
                        0 20px 50px rgba(0, 0, 0, 0.45);
        }
        #calendarCard.play {
            animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both,
                       breathe 3.4s ease-in-out 1.2s infinite;
        }
        @keyframes cardIn {
            0%   { opacity: 0; transform: translateX(70cqw); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 90px rgba(16, 185, 129, 0.16),
                                    0 20px 50px rgba(0, 0, 0, 0.45); }
            50%      { box-shadow: 0 0 130px rgba(16, 185, 129, 0.26),
                                    0 20px 50px rgba(0, 0, 0, 0.45); }
        }
        .card-label { font-size: 5cqw; font-weight: 700; color: #f8fafc; }
        .icon-box {
            width: 12cqw;
            height: 12cqw;
            border-radius: 3.5cqw;
            color: #10b981;
        }
        .icon-box svg { width: 6cqw; height: 6cqw; }

        .month-grid {
            display: grid;
            /* minmax(0,1fr): tracks may shrink below text min-content,
               otherwise wide glyphs push the last column out of the card */
            grid-template-columns: repeat(10, minmax(0, 1fr));
            gap: 1.8cqw;
            margin-top: 5cqw;
        }
        .day {
            aspect-ratio: 1;
            min-width: 0;
            overflow: hidden;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Baloo Da 2', 'Hind Siliguri', sans-serif;
            font-size: 3.4cqw;
            font-weight: 600;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .day.selected {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            font-weight: 700;
            border-color: rgba(16, 185, 129, 0.6);
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.45);
        }
    </style>
</head>
<body>

    <div class="ambient-bg" id="ambientBg"></div>
    <div class="grid-overlay"></div>

    <main class="stage">
        <section class="main-grid">
            <div class="glass-card" id="calendarCard">
                <div class="calendar-header">
                    <span class="card-label">মাসের ক্যালেন্ডার</span>
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </div>
                </div>
                <div class="month-grid" id="monthGrid"></div>
            </div>
        </section>
    </main>

    <script>
        const BN = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
        const bn = n => String(n).replace(/\d/g, d => BN[d]);

        const card = document.getElementById('calendarCard');
        const grid = document.getElementById('monthGrid');

        // Build the 30-day month grid; day 1 selected
        for (let d = 1; d <= 30; d++) {
            const cell = document.createElement('div');
            cell.className = 'day' + (d === 1 ? ' selected' : '');
            cell.textContent = bn(d);
            grid.appendChild(cell);
        }

        function play() {
            card.classList.remove('play');
            void card.offsetWidth; /* restart the entrance animation */
            card.classList.add('play');
        }

        window.addEventListener('DOMContentLoaded', play);
        document.body.addEventListener('click', play);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === 'r' || e.key === 'R') play();
        });
    </script>
</body>
</html>
