<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeHisabi Promo - Scene 1 (0s - 5.48s)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>:root {
            --bg-deep: #060b16;
            --bg-surface: #0d1629;
            --card-bg: rgba(17, 27, 48, 0.78);
            --card-border: rgba(255, 255, 255, 0.09);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-emerald: #10b981;
            --accent-emerald-glow: rgba(16, 185, 129, 0.22);
            --accent-coral: #f43f5e;
            --accent-coral-glow: rgba(244, 63, 94, 0.22);
            --accent-amber: #f59e0b;
            --accent-amber-glow: rgba(245, 158, 11, 0.22);
            --current-accent: var(--accent-emerald);
            --current-glow: var(--accent-emerald-glow);
        }

* {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-deep);
            font-family: 'Hind Siliguri', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

/* Ambient Background Mesh & Grid */
        .ambient-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 25%, var(--current-glow), transparent 45%),
                radial-gradient(circle at 80% 75%, rgba(56, 189, 248, 0.10), transparent 50%),
                linear-gradient(160deg, #050912 0%, #0b1324 55%, #070d19 100%);
            transition: background 0.6s ease;
            z-index: 0;
        }

.grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(circle at center, black 45%, transparent 90%);
            z-index: 1;
        }

.glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 26px;
            padding: 28px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                        border-color 0.45s ease,
                        box-shadow 0.45s ease;
        }

/* Left Card: Calendar Display */
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

.card-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

.icon-box {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--current-accent);
            transition: all 0.4s ease;
        }
        /* ===== Perfect 9:16 stage, content pinned top-center ===== */
        body {
            height: 100dvh;
        }
        .stage {
            aspect-ratio: 9 / 16;
            height: min(100dvh, 177.78vw);
            container-type: size;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 10cqw;
            overflow: hidden;
        }
        .main-grid {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
        }

        /* ===== Month calendar card ===== */
        #calendarCard {
            width: 82%;
            padding: 6cqw;
            border-radius: 6cqw;
            opacity: 0;
            border-color: rgba(16, 185, 129, 0.30);
            /* soft green halo behind the card */
            box-shadow: 0 0 90px rgba(16, 185, 129, 0.16),
                        0 20px 50px rgba(0, 0, 0, 0.45);
        }
        #calendarCard.play {
            animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both,
                       breathe 3.4s ease-in-out 1.2s infinite;
        }
        @keyframes cardIn {
            0%   { opacity: 0; transform: translateX(70cqw); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 90px rgba(16, 185, 129, 0.16),
                                    0 20px 50px rgba(0, 0, 0, 0.45); }
            50%      { box-shadow: 0 0 130px rgba(16, 185, 129, 0.26),
                                    0 20px 50px rgba(0, 0, 0, 0.45); }
        }
        .card-label { font-size: 5cqw; font-weight: 700; color: #f8fafc; }
        .icon-box {
            width: 12cqw;
            height: 12cqw;
            border-radius: 3.5cqw;
            color: #10b981;
        }
        .icon-box svg { width: 6cqw; height: 6cqw; }

        .month-grid {
            display: grid;
            /* minmax(0,1fr): tracks may shrink below text min-content,
               otherwise wide glyphs push the last column out of the card */
            grid-template-columns: repeat(10, minmax(0, 1fr));
            gap: 1.3cqw;
            margin-top: 5cqw;
            /* breathing room: grid never touches the card border,
               even if a viewer computes tracks slightly wide */
            width: calc(100% - 4cqw);
            margin-inline: auto;
        }
        .day {
            aspect-ratio: 1;
            min-width: 0;
            overflow: hidden;
            /* circle slightly narrower than its track: guaranteed gap
               from the card border on every renderer */
            width: 94%;
            margin-inline: auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Baloo Da 2', 'Hind Siliguri', sans-serif;
            font-size: 3cqw;
            font-weight: 600;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .day.selected {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            font-weight: 700;
            border-color: rgba(16, 185, 129, 0.6);
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.45);
        }
    
        /* ============ phone (bottom, rises from below) ============ */
        .phone-wrap {
            position: absolute;
            bottom: 4cqw;
            left: 50%;
            width: 52cqw;
            transform: translate(-50%, 135%);
            z-index: 3;
        }
        .phone-wrap.play { animation: phoneUp .9s cubic-bezier(.22,.9,.26,1) .1s forwards; }
        @keyframes phoneUp { to { transform: translate(-50%, 0); } }
        .phone {
            aspect-ratio: 9 / 18.4;
            background: linear-gradient(160deg, #1a2230, #0a0e15);
            border-radius: 7.5cqw;
            border: 1px solid rgba(255,255,255,.16);
            box-shadow: 0 4cqw 12cqw rgba(0,0,0,.55), 0 0 10cqw rgba(16,185,129,.12);
            padding: 2.4cqw;
            position: relative;
        }
        .phone::after {
            content: ""; position: absolute; right: -.7cqw; top: 22cqw;
            width: .7cqw; height: 9cqw; background: #2a3444; border-radius: .4cqw;
        }
        .screen {
            position: relative; width: 100%; height: 100%;
            border-radius: 5.4cqw; overflow: hidden;
            background:
                radial-gradient(120% 55% at 50% 0%, rgba(16,185,129,.18), transparent 62%),
                linear-gradient(180deg, #0d141d, #070b11);
            display: flex; flex-direction: column; align-items: center;
            padding-top: 6cqw;
        }
        .notch {
            width: 15cqw; height: 3.2cqw; background: #04060a;
            border-radius: 2cqw; margin-bottom: 4.5cqw;
            border: 1px solid rgba(255,255,255,.07);
        }
        .app-name { font-size: 3.2cqw; font-weight: 700; color: #e8eef5; letter-spacing: .05em; }
        .app-name em { font-style: normal; color: #10b981; }
        .bal-label { margin-top: 6cqw; font-size: 3.4cqw; color: #8b98ab; font-weight: 500; }
        .bal-num {
            margin-top: 1.4cqw;
            font-family: 'Baloo Da 2','Hind Siliguri',sans-serif;
            font-size: 8.6cqw; font-weight: 700; color: #fff; line-height: 1.15;
            text-shadow: 0 0 6cqw rgba(16,185,129,.4);
        }
        .bal-num.done { animation: balPop .45s cubic-bezier(.2,1.4,.4,1); }
        @keyframes balPop { 40% { transform: scale(1.1); } }
        .bal-chip {
            margin-top: 3.2cqw; font-size: 3.1cqw; font-weight: 700; color: #34d399;
            background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.38);
            padding: 1.5cqw 3.6cqw; border-radius: 4cqw;
            opacity: 0; transform: translateY(1.2cqw);
        }
        .bal-chip.show { animation: chipIn .5s ease-out forwards; }
        @keyframes chipIn { to { opacity: 1; transform: none; } }

        /* ============ flying taka notes ============ */
        .note {
            position: absolute; top: 0; left: 0;
            width: 16.5cqw; aspect-ratio: 1.85;
            border-radius: 1.1cqw;
            background:
                radial-gradient(circle at 50% 50%, rgba(255,255,255,.30) 0 17%, transparent 18%),
                linear-gradient(135deg, #0e8a58 0%, #14c06e 55%, #0a6e44 100%);
            border: 1px solid rgba(255,255,255,.38);
            box-shadow: 0 1cqw 2.5cqw rgba(0,0,0,.45);
            display: flex; align-items: center; justify-content: center; gap: 1.4cqw;
            color: #fff; z-index: 4; will-change: transform, opacity;
        }
        .note::after {
            content: ""; position: absolute; inset: .9cqw;
            border: 1px dashed rgba(255,255,255,.4); border-radius: .7cqw;
        }
        .note .tk { font-family: 'Baloo Da 2','Hind Siliguri',sans-serif; font-size: 4.8cqw; font-weight: 700; }
        .note .dn { font-family: 'Baloo Da 2','Hind Siliguri',sans-serif; font-size: 3.6cqw; font-weight: 600; opacity: .95; }
    </style>
</head>
<body>

    <div class="ambient-bg" id="ambientBg"></div>
    <div class="grid-overlay"></div>

    <main class="stage">
        <section class="main-grid">
            <div class="glass-card" id="calendarCard">
                <div class="calendar-header">
                    <span class="card-label">মাসের ক্যালেন্ডার</span>
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </div>
                </div>
                <div class="month-grid" id="monthGrid"></div>
            </div>
        </section>
    
        <div class="phone-wrap" id="phoneWrap">
            <div class="phone">
                <div class="screen">
                    <div class="notch"></div>
                    <div class="app-name">Be<em>Hisabi</em></div>
                    <div class="bal-label">মোট ব্যালেন্স</div>
                    <div class="bal-num" id="balNum">৳০</div>
                    <div class="bal-chip" id="balChip">+ ৳৫০,০০০ বেতন</div>
                </div>
            </div>
        </div>
    </main>

        <script>
        const BN = ['\u09E6','\u09E7','\u09E8','\u09E9','\u09EA','\u09EB','\u09EC','\u09ED','\u09EE','\u09EF'];
        const bn = n => String(n).replace(/\d/g, d => BN[d]);
        const bnComma = n => Number(n).toLocaleString('en-IN').replace(/\d/g, d => BN[d]);

        const stage = document.querySelector('.stage');
        const card = document.getElementById('calendarCard');
        const grid = document.getElementById('monthGrid');
        const phoneWrap = document.getElementById('phoneWrap');
        const balNum = document.getElementById('balNum');
        const balChip = document.getElementById('balChip');
        let timers = [];

        // Build the 30-day month grid; day 1 selected
        for (let d = 1; d <= 30; d++) {
            const cell = document.createElement('div');
            cell.className = 'day' + (d === 1 ? ' selected' : '');
            cell.textContent = bn(d);
            grid.appendChild(cell);
        }

        function clearTimers() {
            timers.forEach(clearTimeout); timers = [];
            stage.querySelectorAll('.note').forEach(n => n.remove());
        }

        /* Taka notes fly in from left/right edges and sink into the phone */
        function flyNotes() {
            const sr = stage.getBoundingClientRect();
            const pr = phoneWrap.getBoundingClientRect();
            const tx = pr.left + pr.width / 2 - sr.left;
            const ty = pr.top + pr.height * 0.30 - sr.top;
            const COUNT = 12;
            for (let i = 0; i < COUNT; i++) {
                const fromLeft = i % 2 === 0;
                const el = document.createElement('div');
                el.className = 'note';
                el.innerHTML = '<span class="tk">\u09F3</span><span class="dn">' + bn(1000) + '</span>';
                stage.appendChild(el);
                const x0 = fromLeft ? -sr.width * 0.22 : sr.width * 1.02;
                const y0 = sr.height * (0.30 + Math.random() * 0.35);
                const delay = 750 + i * 62, dur = 540;
                const rot = (Math.random() * 50 - 25).toFixed(1);
                const lift = -(30 + Math.random() * 40);
                const xm = x0 + (tx - x0) * 0.25;
                const f = (x, y, r, sc, o) => ({ transform: `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${r}deg) scale(${sc})`, opacity: o });
                el.animate([
                    Object.assign(f(x0, y0, rot, .9, 0)),
                    Object.assign(f(xm, y0 + lift, (rot / 2).toFixed(1), 1, 1), { offset: .35 }),
                    Object.assign(f(tx, ty, 0, .32, 1), { offset: .82 }),
                    f(tx, ty + 14, 0, .12, 0)
                ], { duration: dur, delay: delay, easing: 'cubic-bezier(.36,.62,.32,1)', fill: 'both' });
                timers.push(setTimeout(() => el.remove(), delay + dur + 120));
            }
        }

        /* Balance counts 0 -> 50,000 while notes land */
        function countUp() {
            balNum.classList.remove('done'); balChip.classList.remove('show');
            balNum.textContent = '\u09F3' + bn(0);
            timers.push(setTimeout(() => {
                const s = performance.now(), D = 1050;
                const step = (t) => {
                    const p = Math.min(1, (t - s) / D);
                    const e = 1 - Math.pow(1 - p, 3);
                    balNum.textContent = '\u09F3' + bnComma(Math.round(50000 * e));
                    if (p < 1) requestAnimationFrame(step);
                    else { balNum.classList.add('done'); balChip.classList.add('show'); }
                };
                requestAnimationFrame(step);
            }, 850));
        }

        function play() {
            clearTimers();
            card.classList.remove('play'); void card.offsetWidth; card.classList.add('play');
            phoneWrap.classList.remove('play'); void phoneWrap.offsetWidth; phoneWrap.classList.add('play');
            flyNotes(); countUp();
        }

        window.addEventListener('DOMContentLoaded', play);
        document.body.addEventListener('click', play);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === 'r' || e.key === 'R') play();
        });
    </script>
</body>
</html>
