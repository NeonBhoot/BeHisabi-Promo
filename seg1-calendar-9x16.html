<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeHisabi Promo - Scene 1 (0s - 5.48s)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>:root {
            --bg-deep: #060b16;
            --bg-surface: #0d1629;
            --card-bg: rgba(17, 27, 48, 0.78);
            --card-border: rgba(255, 255, 255, 0.09);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-emerald: #10b981;
            --accent-emerald-glow: rgba(16, 185, 129, 0.22);
            --accent-coral: #f43f5e;
            --accent-coral-glow: rgba(244, 63, 94, 0.22);
            --accent-amber: #f59e0b;
            --accent-amber-glow: rgba(245, 158, 11, 0.22);
            --current-accent: var(--accent-emerald);
            --current-glow: var(--accent-emerald-glow);
        }

* {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-deep);
            font-family: 'Hind Siliguri', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

/* Ambient Background Mesh & Grid */
        .ambient-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 25%, var(--current-glow), transparent 45%),
                radial-gradient(circle at 80% 75%, rgba(56, 189, 248, 0.10), transparent 50%),
                linear-gradient(160deg, #050912 0%, #0b1324 55%, #070d19 100%);
            transition: background 0.6s ease;
            z-index: 0;
        }

.grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(circle at center, black 45%, transparent 90%);
            z-index: 1;
        }

.glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 26px;
            padding: 28px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                        border-color 0.45s ease,
                        box-shadow 0.45s ease;
        }

/* Left Card: Calendar Display */
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

.card-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

.icon-box {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--current-accent);
            transition: all 0.4s ease;
        }
        /* ===== Perfect 9:16 stage, content pinned top-center ===== */
        body {
            height: 100dvh;
        }
        .stage {
            aspect-ratio: 9 / 16;
            height: min(100dvh, 177.78vw);
            container-type: size;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 7cqw;
            overflow: hidden;
        }
        .main-grid {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
        }

        /* ===== Month calendar card ===== */
        #calendarCard {
            width: 82%;
            padding: 6cqw;
            border-radius: 6cqw;
            opacity: 0;
            border-color: rgba(16, 185, 129, 0.30);
            /* soft green halo behind the card */
            box-shadow: 0 0 90px rgba(16, 185, 129, 0.16),
                        0 20px 50px rgba(0, 0, 0, 0.45);
        }
        #calendarCard.play {
            animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both,
                       breathe 3.4s ease-in-out 1.55s infinite;
        }
        @keyframes cardIn {
            0%   { opacity: 0; transform: translateX(70cqw); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 90px rgba(16, 185, 129, 0.16),
                                    0 20px 50px rgba(0, 0, 0, 0.45); }
            50%      { box-shadow: 0 0 130px rgba(16, 185, 129, 0.26),
                                    0 20px 50px rgba(0, 0, 0, 0.45); }
        }
        .card-label { font-size: 5cqw; font-weight: 700; color: #f8fafc; }
        .icon-box {
            width: 12cqw;
            height: 12cqw;
            border-radius: 3.5cqw;
            color: #10b981;
        }
        .icon-box svg { width: 6cqw; height: 6cqw; }

        .month-grid {
            display: grid;
            /* minmax(0,1fr): tracks may shrink below text min-content,
               otherwise wide glyphs push the last column out of the card */
            grid-template-columns: repeat(10, minmax(0, 1fr));
            gap: 1.3cqw;
            margin-top: 5cqw;
            /* breathing room: grid never touches the card border,
               even if a viewer computes tracks slightly wide */
            width: calc(100% - 4cqw);
            margin-inline: auto;
        }
        .day {
            aspect-ratio: 1;
            min-width: 0;
            overflow: hidden;
            /* circle slightly narrower than its track: guaranteed gap
               from the card border on every renderer */
            width: 94%;
            margin-inline: auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Baloo Da 2', 'Hind Siliguri', sans-serif;
            font-size: 3cqw;
            font-weight: 600;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .day.selected {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            font-weight: 700;
            border-color: rgba(16, 185, 129, 0.6);
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.45);
        }
    
        
        /* ============ salary notification (rises from bottom) ============ */
        .notif-wrap {
            position: absolute;
            top: 9cqw;
            left: 50%;
            width: 78cqw;
            transform: translate(-50%, -170%);
            z-index: 3;
        }
        .notif-wrap.play { animation: notifDown .8s cubic-bezier(.22,.9,.26,1) .1s forwards; }
        @keyframes notifDown { to { transform: translate(-50%, 0); } }
        .notif {
            background: rgba(15, 20, 29, .94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 4.5cqw;
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: 0 4cqw 12cqw rgba(0,0,0,.5), 0 0 9cqw rgba(16,185,129,.12);
            padding: 4.5cqw 5cqw;
        }
        .notif-top { display: flex; align-items: center; gap: 3cqw; }
        .app-icon {
            width: 10.5cqw; height: 10.5cqw; border-radius: 3cqw; flex: none;
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            box-shadow: 0 0 5cqw rgba(37,99,235,.45);
        }
        .app-icon svg { width: 5.8cqw; height: 5.8cqw; }
        .notif-app { font-size: 3.4cqw; font-weight: 700; color: #e8eef5; }
        .notif-time { font-size: 3cqw; color: #7d8ba0; margin-left: auto; }
        .notif-title { margin-top: 3.4cqw; font-size: 4.4cqw; font-weight: 700; color: #fff; }
        .notif-amt {
            margin-top: 1cqw;
            font-family: 'Baloo Da 2','Hind Siliguri',sans-serif;
            font-size: 8.2cqw; font-weight: 700; color: #34d399; line-height: 1.2;
            text-shadow: 0 0 6cqw rgba(16,185,129,.35);
        }
        .notif-amt.done { animation: balPop .45s cubic-bezier(.2,1.4,.4,1); }
        @keyframes balPop { 40% { transform: scale(1.08); } }
        .notif-sub { margin-top: 1.6cqw; font-size: 3.4cqw; color: #8b98ab; font-weight: 500; }
        /* ============ subtitle (SRT line 1) ============ */
        .subtitle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 88%;
            text-align: center;
            font-size: 4.8cqw;
            font-weight: 600;
            color: #fff;
            line-height: 1.5;
            text-shadow: 0 .4cqw 1.2cqw rgba(0,0,0,.92), 0 0 .6cqw rgba(0,0,0,.9);
            opacity: 0;
            z-index: 5;
        }
        .subtitle.show { animation: subIn .3s ease-out forwards; }
        @keyframes subIn { to { opacity: 1; } }
        .subtitle .cursor {
            display: inline-block;
            width: .55cqw; height: 4.4cqw;
            background: #fff;
            margin-left: 1cqw;
            vertical-align: -.5cqw;
            animation: blink .7s steps(1) infinite;
            box-shadow: 0 0 1cqw rgba(0,0,0,.8);
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="ambient-bg" id="ambientBg"></div>
    <div class="grid-overlay"></div>

    <main class="stage">
        <section class="main-grid">
            <div class="glass-card" id="calendarCard">
                <div class="calendar-header">
                    <span class="card-label">মাসের ক্যালেন্ডার</span>
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </div>
                </div>
                <div class="month-grid" id="monthGrid"></div>
            </div>
        </section>
    
        
        <div class="notif-wrap" id="notifWrap">
            <div class="notif">
                <div class="notif-top">
                    <div class="app-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="22" x2="21" y2="22"></line>
                            <line x1="6" y1="18" x2="6" y2="11"></line>
                            <line x1="10" y1="18" x2="10" y2="11"></line>
                            <line x1="14" y1="18" x2="14" y2="11"></line>
                            <line x1="18" y1="18" x2="18" y2="11"></line>
                            <polygon points="12 2 20 7 4 7"></polygon>
                        </svg>
                    </div>
                    <div class="notif-app">Bank</div>
                    <div class="notif-time">এখন</div>
                </div>
                <div class="notif-title">বেতন জমা হয়েছে</div>
                <div class="notif-amt" id="notifAmt">+ ৳০</div>
                <div class="notif-sub">মোট ব্যালেন্স: <span id="notifBal">৳০</span></div>
            </div>
        </div>
        <div class="subtitle" id="subtitle"></div>
</main>

            <script>
        const BN = ['\u09E6','\u09E7','\u09E8','\u09E9','\u09EA','\u09EB','\u09EC','\u09ED','\u09EE','\u09EF'];
        const bn = n => String(n).replace(/\d/g, d => BN[d]);
        const bnComma = n => Number(n).toLocaleString('en-IN').replace(/\d/g, d => BN[d]);

        const card = document.getElementById('calendarCard');
        const grid = document.getElementById('monthGrid');
        const notifWrap = document.getElementById('notifWrap');
        const notifAmt = document.getElementById('notifAmt');
        const notifBal = document.getElementById('notifBal');
        const subtitle = document.getElementById('subtitle');
        const SUB_TEXT = '১ তারিখে বেতন এলো...';
        let timers = [];

        // Build the 30-day month grid; day 1 selected
        for (let d = 1; d <= 30; d++) {
            const cell = document.createElement('div');
            cell.className = 'day' + (d === 1 ? ' selected' : '');
            cell.textContent = bn(d);
            grid.appendChild(cell);
        }

        function clearTimers() { timers.forEach(clearTimeout); timers = []; }

        /* Salary amount counts 0 -> 50,000 after the notification lands */
        function countUp() {
            notifAmt.classList.remove('done');
            notifAmt.textContent = '+ \u09F3' + bn(0);
            notifBal.textContent = '\u09F3' + bn(0);
            timers.push(setTimeout(() => {
                const s = performance.now(), D = 800;
                const step = (t) => {
                    const p = Math.min(1, (t - s) / D);
                    const e = 1 - Math.pow(1 - p, 3);
                    const v = bnComma(Math.round(50011 * e));
                    notifAmt.textContent = '+ \u09F3' + v;
                    notifBal.textContent = '\u09F3' + v;
                    if (p < 1) requestAnimationFrame(step);
                    else notifAmt.classList.add('done');
                };
                requestAnimationFrame(step);
            }, 1150));
        }

        /* Subtitle types itself out, grapheme-safe for Bengali */
        function typeSubtitle() {
            subtitle.classList.remove('show');
            void subtitle.offsetWidth;
            subtitle.classList.add('show');
            const segs = [...new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(SUB_TEXT)].map(s => s.segment);
            subtitle.innerHTML = '<span id="subText"></span><span class="cursor"></span>';
            const txt = subtitle.querySelector('#subText');
            let i = 0;
            const tick = () => {
                if (i < segs.length) {
                    txt.textContent += segs[i++];
                    timers.push(setTimeout(tick, 55));
                } else {
                    const cur = subtitle.querySelector('.cursor');
                    if (cur) cur.style.display = 'none';
                }
            };
            tick();
        }

        function play() {
            clearTimers();
            card.classList.remove('play'); void card.offsetWidth; card.classList.add('play');
            notifWrap.classList.remove('play'); void notifWrap.offsetWidth; notifWrap.classList.add('play');
            countUp();
            timers.push(setTimeout(typeSubtitle, 400));
        }

        window.addEventListener('DOMContentLoaded', play);
        document.body.addEventListener('click', play);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === 'r' || e.key === 'R') play();
        });
    </script>
</body>
</html>
